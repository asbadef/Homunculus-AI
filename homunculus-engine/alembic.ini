# Alembic configuration for Homunculus engine.
# The actual database URL is read from the DATABASE_URL environment variable
# inside alembic/env.py — do NOT hardcode credentials here.
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# sqlalchemy.url is intentionally left blank; env.py injects DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
