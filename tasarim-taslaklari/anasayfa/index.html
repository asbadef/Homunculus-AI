<style>
/* a1 · "Girişin devamı" — giriş ekranının gün/gece renkleri (app.css + ek.css) aynen. */
:root, [data-theme="gun"] {
  --page:#f5f8fb; --card:#ffffff; --card2:#f1f4f8; --ink:#152231; --mute:#5c6b7d; --line:#e1e6ee; --line2:#cbd3de;
  --pri:#0e7490; --onpri:#ffffff; --priSoft:#e0f2f7; --priInk:#0e7490;
  --crit:#dc2626; --critSoft:#fdecec; --mid:#ca8a04; --midSoft:#fdf6e3; --ok:#16a34a; --okSoft:#e7f6ec;
  --spo:#a16207; --hr:#15803d; --tile:#f6f8fb;
  --shadow:0 20px 50px rgba(20,30,50,.10); --shadowS:0 6px 18px rgba(20,30,50,.06);
  --glow1:#0e7490; --glow2:#1d4ed8; --glowOp:.18; --dots:rgba(14,116,144,.14);
  --hdr:rgba(245,248,251,.82);
}
[data-theme="gece"] {
  --page:#07101f; --card:#0f1b2e; --card2:#15243b; --ink:#e8eef7; --mute:#8fa1ba; --line:#1c2c45; --line2:#2a3f60;
  --pri:#22b8d6; --onpri:#03141c; --priSoft:rgba(34,184,214,.13); --priInk:#7dd3e6;
  --crit:#ef4444; --critSoft:rgba(239,68,68,.12); --mid:#eab308; --midSoft:rgba(234,179,8,.12); --ok:#22c55e; --okSoft:rgba(34,197,94,.12);
  --spo:#ffe14a; --hr:#22e05a; --tile:#07101f;
  --shadow:0 24px 60px rgba(0,0,0,.45); --shadowS:0 8px 22px rgba(0,0,0,.3);
  --glow1:#0e7490; --glow2:#1d4ed8; --glowOp:.5; --dots:rgba(143,161,186,.07);
  --hdr:rgba(7,16,31,.8);
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; scroll-padding-top:80px; }
html, body { margin:0; overflow-x:clip; }
body { background:var(--page); color:var(--ink); font:16px/1.55 Figtree, system-ui, sans-serif; -webkit-font-smoothing:antialiased; transition:background .3s, color .3s; }
a { color:var(--pri); }
button { font:inherit; color:inherit; }
h1, h2, h3 { font-family:"Space Grotesk", Figtree, sans-serif; letter-spacing:-.01em; margin:0; }
.mono { font-family:"JetBrains Mono", monospace; }
svg.i { width:18px; height:18px; flex:none; }
/* 24.09 · Ozan: 1920'de iki yanda ~370 px boşluk kalıyordu → kap 1440'a genişledi, kenar payı ekranla büyür */
.wrap { width:100%; max-width:1680px; margin:0 auto; padding:0 clamp(16px, 4vw, 80px); }

/* ---------- logo ---------- */
.brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); min-width:0; }
.mk { width:36px; height:36px; border-radius:11px; display:grid; place-items:center; background:#0e7490; color:#fff; font:700 19px "Space Grotesk", system-ui, sans-serif; box-shadow:0 8px 18px rgba(14,116,144,.25); flex:none; }
[data-theme="gece"] .mk { background:#e8eef7; color:#07101f; box-shadow:0 0 0 5px rgba(232,238,247,.06); }
.brand b { font:700 19px "Space Grotesk", system-ui, sans-serif; }

/* ---------- üst çubuk ---------- */
.hdr { position:sticky; top:0; z-index:50; background:var(--hdr); backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid transparent; transition:border-color .2s, background .3s; }
.hdr.sc { border-color:var(--line); background:color-mix(in srgb, var(--card) 92%, transparent); box-shadow:0 6px 20px rgba(20,30,50,.07); }
[data-theme="gece"] .hdr.sc { box-shadow:0 6px 24px rgba(0,0,0,.35); }
/* kaydırma ilerleme çizgisi: sabit üst çubuğun altında ince şerit */
.anc { display:block; height:0; }
.prog { position:absolute; left:0; bottom:-1px; height:2px; width:100%; transform-origin:0 50%; transform:scaleX(0); background:var(--pri); pointer-events:none; }
.hdr .wrap { display:flex; align-items:center; gap:18px; height:68px; }
.nav { position:relative; display:flex; gap:2px; margin:0 auto; padding:4px; border-radius:14px; background:color-mix(in srgb, var(--card2) 70%, transparent); border:1px solid var(--line); }
.nav-ind { position:absolute; top:4px; bottom:4px; left:0; width:0; border-radius:10px; background:var(--card); box-shadow:var(--shadowS); transition:transform .3s cubic-bezier(.2,.8,.2,1), width .3s cubic-bezier(.2,.8,.2,1), opacity .2s; opacity:0; z-index:0; }
[data-theme="gece"] .nav-ind { background:var(--card2); }
.nav a { position:relative; z-index:1; }
.pilotL { height:40px; }
.nav a { padding:8px 12px; border-radius:10px; color:var(--mute); text-decoration:none; font:600 14px Figtree, system-ui, sans-serif; white-space:nowrap; transition:color .15s, background .15s; }
.nav a:hover { color:var(--ink); background:var(--card2); }
.nav a.on { color:var(--ink); }
/* Figtree "ə" harfini taşımıyor; yedek yazı tipi satırı kaydırmasın diye yükseklik sabit */
.nav a, .chips span, .lsel b { line-height:20px; }
.nav a { display:inline-flex; align-items:center; height:36px; }
.tools { display:flex; align-items:center; gap:8px; }
.lsel { display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 10px 0 8px; border-radius:11px; border:1px solid var(--line); background:var(--card); cursor:pointer; color:var(--ink); font:700 12.5px Figtree, system-ui, sans-serif; transition:border-color .15s; }
.lsel:hover, .lsel[aria-expanded="true"] { border-color:var(--pri); }
.lsel svg.i { width:14px; height:14px; color:var(--mute); }
.flagbox { position:relative; display:block; flex:none; width:22px; height:15px; border-radius:3px; overflow:hidden; }
.flagbox svg { display:block; width:100%; height:100%; }
.flagbox::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 1px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.25); pointer-events:none; }
.ib { width:38px; height:38px; border-radius:11px; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; cursor:pointer; color:var(--ink); transition:border-color .15s; }
.ib:hover { border-color:var(--pri); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 16px; border-radius:12px; border:1px solid var(--line2); background:var(--card); color:var(--ink); font:700 14px Figtree, system-ui, sans-serif; text-decoration:none; cursor:pointer; white-space:nowrap; transition:transform .12s, box-shadow .2s, border-color .15s, filter .2s; }
.btn:hover { border-color:var(--pri); }
.btn.p { background:var(--pri); color:var(--onpri); border-color:var(--pri); }
.btn.p:hover { box-shadow:0 10px 24px color-mix(in srgb, var(--pri) 35%, transparent); filter:brightness(1.05); }
.btn.lg { height:48px; padding:0 22px; font-size:15px; }
.btn svg.i { transition:transform .2s; } .btn:hover svg.i.go { transform:translateX(3px); }
.lwrap { position:relative; }
/* 30.09: uygulamadaki dil menüsüyle aynı ölçüler (app.css .menu + ek.css .menu .lopt) */
.lmenu { position:absolute; right:0; top:46px; min-width:230px; background:var(--card); border:1px solid var(--line2); border-radius:14px; box-shadow:var(--shadow); padding:8px; z-index:60; animation:up .14s ease-out; }
.lmenu[hidden] { display:none; }
.lopt { display:flex; align-items:center; gap:12px; width:100%; padding:9px 10px; border:0; background:none; border-radius:9px; cursor:pointer; text-align:left; color:var(--ink); font:600 13px Figtree, system-ui, sans-serif; }
.lopt:hover { background:var(--card2); } .lopt.on { background:var(--priSoft); }
.lopt .flagbox { width:24px; height:16px; flex:none; }
.lopt .lt { display:flex; flex-direction:column; line-height:1.2; flex:1; font-weight:600; font-size:13px; }
.lopt small { color:var(--mute); font:600 11px Figtree, system-ui, sans-serif; }
.lopt svg.i { color:var(--pri); width:16px; height:16px; }
.mnav { display:none; }
.mpanel { display:none; }
.loginS { display:none; }

/* ---------- kahraman ---------- */
.hero { position:relative; isolation:isolate; overflow:hidden; }
.bg { position:absolute; inset:0; z-index:-1; overflow:hidden; background-image:radial-gradient(var(--dots) 1px, transparent 1px); background-size:26px 26px; -webkit-mask-image:radial-gradient(90% 75% at 25% 20%, #000 35%, transparent 85%); mask-image:radial-gradient(90% 75% at 25% 20%, #000 35%, transparent 85%); }
[data-theme="gece"] .bg { background-image:linear-gradient(var(--dots) 1px, transparent 1px), linear-gradient(90deg, var(--dots) 1px, transparent 1px); background-size:44px 44px; }
.bg i { position:absolute; border-radius:50%; filter:blur(60px); opacity:var(--glowOp); animation:float 18s ease-in-out infinite alternate; }
.bg i:nth-child(1) { width:460px; height:460px; left:-140px; top:-160px; background:var(--glow1); }
.bg i:nth-child(2) { width:380px; height:380px; right:-120px; top:30%; background:var(--glow2); opacity:calc(var(--glowOp) * .6); animation-duration:23s; }
.bg i:nth-child(3) { width:300px; height:300px; left:30%; bottom:-180px; background:#22b8d6; opacity:calc(var(--glowOp) * .5); animation-duration:27s; }
[data-theme="gun"] .hero { background:linear-gradient(135deg, #e9f4f8 0%, #f5f8fb 55%, #eaf2fb 100%); }
@keyframes float { from { transform:translate(0,0) scale(1); } to { transform:translate(60px,40px) scale(1.15); } }
.hero .wrap { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.08fr); gap:clamp(40px, 5vw, 88px); align-items:center; padding-top:clamp(56px, 7vh, 96px); padding-bottom:56px; min-height:min(calc(100vh - 68px), 860px); }
.pill { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; border:1px solid color-mix(in srgb, var(--pri) 30%, transparent); background:var(--card); color:var(--priInk); font:700 12.5px Figtree, system-ui, sans-serif; margin-bottom:20px; max-width:100%; }
[data-theme="gece"] .pill { background:rgba(34,184,214,.08); border-color:rgba(125,211,230,.35); }
.pill i { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
.hero h1 { font-size:clamp(34px, 3.9vw, 68px); line-height:1.02; margin-bottom:22px; }
.hero h1 .rot { display:block; }
.hero h1 .rest { display:block; font-size:.47em; line-height:1.2; margin-top:.35em; white-space:nowrap; color:var(--ink); letter-spacing:-.005em; }
@media (max-width:1080px) { .hero h1 .rest { white-space:normal; font-size:.55em; } }
.rot { color:var(--priInk); display:inline-block; }
.hero h1 .rot { text-decoration:underline; text-decoration-thickness:.06em; text-underline-offset:.14em; text-decoration-color:color-mix(in srgb, var(--pri) 40%, transparent); }
.rot.in { animation:rot .45s ease-out; }
@keyframes rot { from { opacity:0; transform:translateY(10px); filter:blur(3px); } to { opacity:1; transform:none; filter:none; } }
.lead { color:var(--mute); font-size:clamp(17px, 1.25vw, 20px); max-width:600px; margin:0 0 30px; }
/* ürünün kendi ölçüleri — sonuç iddiası değil, prototipte sayılabilen şeyler */
.lead2 { color:var(--mute); font-size:16px; max-width:600px; margin:-14px 0 30px; }
.vals { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; margin-top:34px; }
.val { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--c); border-radius:12px; padding:12px 14px; min-width:0; }
[data-theme="gece"] .val { background:rgba(15,27,46,.72); }
.val b { display:block; font:700 14px Figtree, system-ui, sans-serif; color:var(--ink); margin-bottom:3px; }
.val span { display:block; font-size:13px; line-height:1.45; color:var(--mute); }
.facts { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin-top:34px; max-width:640px; }
.facts div { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; min-width:0; }
[data-theme="gece"] .facts div { background:rgba(15,27,46,.7); }
.facts b { display:block; font:700 24px/1.1 "Space Grotesk", system-ui, sans-serif; color:var(--priInk); }
.facts span { display:block; font-size:12.5px; color:var(--mute); margin-top:3px; line-height:1.3; }
[data-theme="gun"] .lead { color:#4a5b6e; }
.ctas { display:flex; gap:10px; flex-wrap:wrap; }
.trust { display:flex; gap:10px 22px; flex-wrap:wrap; font-size:13px; color:var(--mute); border-top:1px solid var(--line); margin-top:28px; padding-top:16px; }
.trust span { display:flex; align-items:center; gap:7px; }
.trust svg.i { width:16px; height:16px; color:var(--ok); }

/* canlı birim kartı — girişteki sahnenin aynısı */
.scene { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px; box-shadow:var(--shadow); }
[data-theme="gece"] .scene { background:rgba(4,10,20,.78); backdrop-filter:blur(10px); border-color:#1f3150; }
.sc-head { display:flex; justify-content:space-between; align-items:center; gap:10px; font:700 12px Figtree, system-ui, sans-serif; color:var(--mute); margin-bottom:10px; }
.sc-head > span:first-child { display:flex; align-items:center; gap:8px; min-width:0; }
.dot { width:7px; height:7px; border-radius:50%; background:#22c55e; flex:none; animation:dot 1.6s ease-out infinite; }
@keyframes dot { from { box-shadow:0 0 0 0 rgba(34,197,94,.6); } to { box-shadow:0 0 0 8px rgba(34,197,94,0); } }
.sc-grid { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; }
.sc-bed { background:var(--tile); border:1px solid var(--line); border-radius:12px; padding:8px 9px 7px; transition:border-color .4s, box-shadow .4s, background .4s; min-width:0; }
.sc-no { display:flex; justify-content:space-between; align-items:center; } .sc-no b { font-size:11.5px; color:var(--ink); }
[data-theme="gece"] .sc-no b { color:#a9bccf; }
.sc-no i { width:7px; height:7px; border-radius:50%; background:#22c55e; transition:background .4s; }
.sc-bed svg { width:100%; height:22px; display:block; margin:4px 0 2px; }
.sc-bed polyline { fill:none; stroke:#22b8d6; stroke-width:1.6; vector-effect:non-scaling-stroke; opacity:.8; transition:stroke .4s; }
.sc-v { display:flex; justify-content:space-between; align-items:baseline; } .sc-v small { font:700 9.5px Figtree, system-ui, sans-serif; color:var(--mute); } .sc-v b { font-size:16px; color:var(--spo); transition:color .4s; }
.sc-bed.warn { border-color:#eab308; } .sc-bed.warn .sc-no i { background:#eab308; } .sc-bed.warn polyline { stroke:#eab308; }
.sc-bed.crit { border-color:#ef4444; background:var(--critSoft); animation:crit 1s steps(2, jump-none) infinite; } .sc-bed.crit .sc-no i { background:#ef4444; } .sc-bed.crit polyline { stroke:#ef4444; } .sc-bed.crit .sc-v b { color:var(--crit); }
@keyframes crit { 0% { box-shadow:0 0 0 1px #ef4444, 0 0 22px rgba(239,68,68,.4); } 100% { box-shadow:none; } }
.sc-bed.ok { border-color:#22c55e; } .sc-bed.ok .sc-v b { color:var(--ok); }
/* 30.09: hekim gördü — yatak yeşil çerçeve, değer hâlâ kırmızı (karar hekimin); yanıt vermeyen basamak sarı */
.sc-bed.seen { border-color:#16a34a; box-shadow:0 0 0 1px #16a34a; } .sc-bed.seen .sc-no i { background:#16a34a; } .sc-bed.seen polyline { stroke:#ef4444; } .sc-bed.seen .sc-v b { color:var(--crit); }
.sc-st.nr { border-color:color-mix(in srgb, #ca8a04 55%, transparent); background:var(--midSoft); } .sc-st.nr .ic { background:#eab308; color:#fff; } .sc-st.nr b { color:#a16207; }
[data-theme="gece"] .sc-st.nr b { color:var(--mid); }
.sc-cap.w { color:#a16207; } [data-theme="gece"] .sc-cap.w { color:var(--mid); }
/* 29.09: üç çip yan yana sığmıyordu (AZ/RU'da "Baş tibb bacısı +3 dəq" komşusunun altına giriyordu) → her genişlikte
   telefondaki üç sütunlu düzen: simge üstte, ad ve süre altta. */
.sc-chain { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; margin-top:12px; }
.sc-ln { display:none; }
.sc-chain .sc-st { flex-direction:column; gap:4px; border-radius:14px; padding:8px 4px; text-align:center; }
.sc-chain .sc-st b { white-space:normal; line-height:1.2; }
.sc-st { display:flex; align-items:center; gap:8px; padding:7px 10px 7px 7px; border-radius:999px; border:1px solid var(--line); background:var(--tile); transition:all .35s; min-width:0; }
.sc-st .ic { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--card2); color:var(--mute); transition:all .35s; flex:none; }
.sc-st .ic svg.i { width:14px; height:14px; }
.sc-st b { font:700 12px Figtree, system-ui, sans-serif; color:var(--mute); white-space:nowrap; } .sc-st small { font-size:10.5px; color:var(--mute); white-space:nowrap; }
.sc-st.on { border-color:#ef4444; background:var(--critSoft); } .sc-st.on .ic { background:#ef4444; color:#fff; box-shadow:0 0 0 5px rgba(239,68,68,.18); } .sc-st.on b { color:var(--crit); }
.sc-st.done { border-color:color-mix(in srgb, var(--ok) 50%, transparent); } .sc-st.done .ic { background:#16a34a; color:#fff; } .sc-st.done b { color:var(--ok); }
.sc-cap { margin-top:12px; font:700 14px/1.45 Figtree, system-ui, sans-serif; color:var(--ink); min-height:2.9em; }
.sc-cap.in { animation:rot .4s ease-out; } .sc-cap.c { color:var(--crit); } .sc-cap.g { color:var(--ok); }

/* ---------- bölümler ---------- */
section.s { padding:96px 0; }
section.s.alt { background:var(--card); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
[data-theme="gece"] section.s.alt { background:#0a1628; }
.kick { display:inline-flex; align-items:center; gap:8px; font:700 12px Figtree, system-ui, sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--priInk); margin-bottom:12px; }
.kick::before { content:""; width:18px; height:2px; border-radius:2px; background:currentColor; }
.s h2 { font-size:clamp(28px, 3.2vw, 40px); line-height:1.12; max-width:720px; }
.s .sub { color:var(--mute); font-size:17px; max-width:620px; margin:12px 0 0; }
.head { margin-bottom:44px; }

/* 30.09 · "Bir değer bozulduğunda ne olur?" — üç adımlık kartların yerine hareketli hikâye (Ozan: "ana sayfa biraz hareketlensin").
   Birim ekranında REA03 kızarır → NEWS2 hekim onayına düşer → hemşirenin telefonuna bildirim → 3 dk yanıt yok →
   sorumlu hemşire → 5. dk hekim görür. Altta zaman çizelgesi, sağda denetim kaydı satır satır dolar.
   Ekran dışındayken durur; "hareketi azalt" açıksa son hâl gösterilir. */
.story { position:relative; background:var(--card); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow); padding:18px; overflow:hidden; isolation:isolate; }
[data-theme="gece"] .story { background:#0a1628; }
.story::before { content:""; position:absolute; inset:-30% -10% auto auto; width:520px; height:520px; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--crit) 16%, transparent), transparent); opacity:0; transition:opacity .8s; z-index:-1; pointer-events:none; }
.story[data-p="1"]::before, .story[data-p="2"]::before, .story[data-p="3"]::before, .story[data-p="4"]::before { opacity:1; }
.st-top { display:flex; align-items:center; gap:14px; padding:4px 4px 16px; border-bottom:1px solid var(--line); margin-bottom:16px; }
.st-clock { display:flex; align-items:center; gap:8px; padding:6px 12px 6px 10px; border-radius:12px; background:var(--card2); border:1px solid var(--line); flex:none; }
.st-clock svg.i { width:16px; height:16px; color:var(--mute); }
.st-clock b { font:700 20px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing:-.02em; min-width:5ch; display:inline-block; }
.st-clock b.tick { animation:tick .35s ease-out; }
@keyframes tick { from { transform:translateY(-8px); opacity:0; } to { transform:none; opacity:1; } }
.st-cap { margin:0; flex:1; min-width:0; font:700 16px Figtree, system-ui, sans-serif; color:var(--ink); }
.st-cap.in { animation:rot .45s ease-out; }
.st-cap.c { color:var(--crit); } .st-cap.w { color:var(--mid); } .st-cap.g { color:var(--ok); }
[data-theme="gun"] .st-cap.w { color:#a16207; }
.st-replay { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--mute); font:700 12.5px Figtree, system-ui, sans-serif; cursor:pointer; flex:none; }
.st-replay:hover { color:var(--ink); border-color:var(--pri); }
.st-replay svg.i { width:14px; height:14px; }
.st-body { display:grid; grid-template-columns:minmax(0, 1.12fr) minmax(0, .78fr) minmax(0, 1fr); gap:16px; align-items:stretch; }
.st-pane { position:relative; background:var(--page); border:1px solid var(--line); border-radius:18px; padding:14px; min-width:0; }
[data-theme="gece"] .st-pane { background:#07101f; }
.st-h { display:flex; align-items:center; gap:8px; font:700 11.5px Figtree, system-ui, sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin-bottom:12px; }
.st-h svg.i { width:15px; height:15px; }
.st-h .live { margin-left:auto; display:inline-flex; align-items:center; gap:6px; letter-spacing:.04em; color:var(--ok); }
.st-h .live::before { content:""; width:7px; height:7px; border-radius:50%; background:#22c55e; animation:dot 1.6s ease-out infinite; }
/* birim ekranı */
.st-beds { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; }
.sb2 { position:relative; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 9px 7px; min-width:0; transition:border-color .4s, background .4s, box-shadow .4s, transform .4s; }
[data-theme="gece"] .sb2 { background:#0f1b2e; }
.sb2 .no { display:flex; justify-content:space-between; align-items:center; font:700 11.5px "JetBrains Mono", ui-monospace, monospace; color:var(--mute); }
.sb2 .no i { width:7px; height:7px; border-radius:50%; background:#22c55e; transition:background .4s; }
.sb2 svg { display:block; width:100%; height:26px; margin:5px 0 3px; }
.sb2 polyline { fill:none; stroke:#22b8d6; stroke-width:1.6; vector-effect:non-scaling-stroke; transition:stroke .4s; }
.sb2 .v { display:flex; justify-content:space-between; align-items:baseline; }
.sb2 .v small { font:700 9.5px Figtree, system-ui, sans-serif; color:var(--mute); }
.sb2 .v b { font:700 18px "JetBrains Mono", ui-monospace, monospace; color:var(--spo); transition:color .4s; }
.sb2.crit { border-color:#ef4444; background:var(--critSoft); animation:crit 1s steps(2, jump-none) infinite; transform:scale(1.04); z-index:1; }
.sb2.crit .no i { background:#ef4444; } .sb2.crit polyline { stroke:#ef4444; } .sb2.crit .v b { color:var(--crit); } .sb2.crit .no { color:var(--crit); }
.sb2.seen { border-color:#16a34a; background:var(--okSoft); animation:none; transform:none; } .sb2.seen .no i { background:#16a34a; } .sb2.seen .v b { color:var(--crit); }
.st-news { margin-top:12px; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; border:1px dashed var(--line2); color:var(--mute); font:600 13px Figtree, system-ui, sans-serif; min-height:58px; transition:all .4s; }
.st-news .sc { display:grid; place-items:center; width:40px; height:40px; border-radius:12px; background:var(--card2); color:var(--mute); font:700 18px "JetBrains Mono", ui-monospace, monospace; flex:none; transition:all .4s; }
.st-news .sn { display:grid; gap:1px; min-width:0; } .st-news .sn b { color:var(--ink); font-size:14px; } .st-news .sn small { font-size:12px; }
.st-news .sg { margin-left:auto; flex:none; font:700 11px Figtree, system-ui, sans-serif; padding:4px 9px; border-radius:999px; background:var(--midSoft); color:#a16207; border:1px solid color-mix(in srgb, #ca8a04 45%, transparent); opacity:0; transform:translateX(8px); transition:all .4s .15s; }
[data-theme="gece"] .st-news .sg { color:var(--mid); }
.story.nw .st-news { border-style:solid; border-color:color-mix(in srgb, var(--crit) 45%, transparent); background:var(--card); }
[data-theme="gece"] .story.nw .st-news { background:#0f1b2e; }
.story.nw .st-news .sc { background:var(--crit); color:#fff; animation:pop .5s cubic-bezier(.2,.9,.3,1.4); }
.story.nw .st-news .sg { opacity:1; transform:none; }
@keyframes pop { from { transform:scale(.4); } to { transform:none; } }
/* hemşirenin telefonu (çizim) */
.st-ph { display:flex; flex-direction:column; }
.mph { position:relative; align-self:center; width:100%; max-width:212px; aspect-ratio:9 / 17.5; margin-top:auto; margin-bottom:auto; border-radius:30px; padding:7px; background:linear-gradient(150deg, #3a4556, #0b1220 25%, #0b1220 75%, #2a3444); box-shadow:0 24px 50px -18px rgba(6,20,30,.55); transition:box-shadow .4s, transform .4s; }
.story.ring .mph { animation:shake .5s ease-in-out 2; box-shadow:0 0 0 4px rgba(239,68,68,.35), 0 24px 50px -18px rgba(6,20,30,.55); }
@keyframes shake { 0%, 100% { transform:none; } 20% { transform:rotate(-3deg); } 40% { transform:rotate(3deg); } 60% { transform:rotate(-2deg); } 80% { transform:rotate(2deg); } }
.mp-scr { position:relative; height:100%; border-radius:24px; overflow:hidden; background:#f3f5f9; color:#152231; padding:30px 9px 9px; display:flex; flex-direction:column; gap:6px; font-family:Figtree, system-ui, sans-serif; }
[data-theme="gece"] .mp-scr { background:#0b1220; color:#e8eef7; }
.mp-scr::before { content:""; position:absolute; left:50%; top:7px; width:56px; height:15px; border-radius:10px; background:#05080f; transform:translateX(-50%); }
.mp-hd { display:flex; justify-content:space-between; align-items:center; font:700 15px "Space Grotesk", system-ui, sans-serif; }
.mp-hd i { width:22px; height:22px; border-radius:50%; background:#0e7490; color:#fff; font:800 8.5px Figtree; font-style:normal; display:grid; place-items:center; }
.mp-row { display:flex; align-items:center; gap:7px; padding:7px 8px; border-radius:10px; background:#fff; border:1px solid #dde4ec; font-size:10.5px; font-weight:600; }
[data-theme="gece"] .mp-row { background:#111c30; border-color:#1f2e48; }
.mp-row span { font:600 9.5px "JetBrains Mono", ui-monospace, monospace; color:#5c6b7d; width:30px; flex:none; }
.mp-row i { width:2px; align-self:stretch; border-radius:2px; background:#cbd3de; }
.mp-al { display:grid; gap:4px; padding:10px; border-radius:14px; background:linear-gradient(135deg, #dc2626, #b91c1c); color:#fff; transform:translateY(12px) scale(.96); opacity:0; max-height:0; padding-block:0; overflow:hidden; transition:all .45s cubic-bezier(.2,.9,.3,1.1); }
.story.al .mp-al { transform:none; opacity:1; max-height:220px; padding-block:10px; }
.mp-al .k { font:800 9px Figtree; letter-spacing:.08em; text-transform:uppercase; color:#ffe1e1; }
.mp-al b { font:700 17px "JetBrains Mono", ui-monospace, monospace; }
.mp-al small { font-size:10.5px; opacity:.92; }
.mp-al .bt { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:4px; }
.mp-al .bt span { display:grid; place-items:center; height:26px; border-radius:9px; font:700 10px Figtree; background:rgba(255,255,255,.18); }
.mp-al .bt span:first-child { background:#fff; color:#b91c1c; }
.mp-al .tm { display:none; align-items:center; gap:5px; font:700 10px Figtree; padding:4px 7px; border-radius:8px; background:rgba(0,0,0,.22); justify-self:start; }
.story.nr .mp-al .tm { display:inline-flex; animation:rot .4s ease-out; }
.story.ok .mp-al { background:linear-gradient(135deg, #16a34a, #15803d); }
.story.ok .mp-al .bt, .story.ok .mp-al .tm { display:none; }
.mp-al .ok { display:none; align-items:center; gap:6px; font:700 11px Figtree; }
.mp-al .ok svg.i { width:14px; height:14px; }
.story.ok .mp-al .ok { display:flex; animation:rot .4s ease-out; }
.mp-push { position:absolute; left:6px; right:6px; top:27px; z-index:3; display:grid; gap:1px; padding:7px 9px; border-radius:12px; background:rgba(15,27,46,.95); color:#fff; box-shadow:0 10px 24px rgba(0,0,0,.3); transform:translateY(-140%); opacity:0; transition:transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .3s; }
.mp-push .fp-app { display:flex; align-items:center; gap:5px; font:700 8.5px Figtree; color:#cfe3ea; }
.mp-push .fp-app i { width:13px; height:13px; border-radius:4px; background:#0e7490; color:#fff; font:700 8px "Space Grotesk"; font-style:normal; display:grid; place-items:center; }
.mp-push .fp-app em { margin-left:auto; font-style:normal; font-weight:600; color:#9fb6c3; }
.mp-push b { font:700 10.5px Figtree; }
.story.push .mp-push { transform:none; opacity:1; }
.mp-scr .unit-ping { display:none; }
/* zincir + denetim kaydı */
.ch { list-style:none; margin:0; padding:0; display:grid; gap:0; position:relative; }
.ch li { position:relative; display:flex; align-items:center; gap:12px; padding:8px 8px 8px 6px; border-radius:14px; border:1px solid transparent; transition:all .35s; }
.ch li + li::before { content:""; position:absolute; left:23px; top:-10px; width:2px; height:20px; background:var(--line2); border-radius:2px; transition:background .35s; }
.ch .ic { position:relative; z-index:1; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--card2); color:var(--mute); border:1px solid var(--line); flex:none; transition:all .35s; }
.ch .ic svg.i { width:16px; height:16px; }
.ch div { min-width:0; flex:1; } .ch b { display:block; font:700 14px Figtree, system-ui, sans-serif; color:var(--mute); transition:color .35s; }
.ch small { display:flex; gap:6px; align-items:center; font:600 11.5px Figtree, system-ui, sans-serif; color:var(--mute); }
.ch small .mono { font-size:11px; }
.ch small em { font-style:normal; }
.ch li.on { border-color:#ef4444; background:var(--critSoft); } .ch li.on .ic { background:#ef4444; color:#fff; border-color:#ef4444; animation:ring 1.2s ease-out infinite; } .ch li.on b { color:var(--crit); }
@keyframes ring { from { box-shadow:0 0 0 0 rgba(239,68,68,.5); } to { box-shadow:0 0 0 10px rgba(239,68,68,0); } }
.ch li.nr .ic { background:var(--midSoft); color:#a16207; border-color:color-mix(in srgb, #ca8a04 45%, transparent); } .ch li.nr b { color:var(--ink); } .ch li.nr small em { color:#a16207; font-weight:700; }
[data-theme="gece"] .ch li.nr .ic, [data-theme="gece"] .ch li.nr small em { color:var(--mid); }
.ch li.done .ic { background:#16a34a; color:#fff; border-color:#16a34a; } .ch li.done b { color:var(--ok); } .ch li.done small em { color:var(--ok); font-weight:700; }
.ch li.on::before, .ch li.done::before, .ch li.nr + li.on::before { background:var(--pri); }
.st-h2 { margin:16px 0 8px; padding-top:14px; border-top:1px solid var(--line); }
.log { list-style:none; margin:0; padding:0; display:grid; gap:4px; min-height:124px; align-content:start; }
.log li { display:flex; gap:8px; align-items:baseline; font-size:12.5px; color:var(--ink); padding:3px 6px; border-radius:7px; animation:logIn .4s ease-out; }
.log li:last-child { background:var(--priSoft); }
.log li span { font:600 11px "JetBrains Mono", ui-monospace, monospace; color:var(--mute); flex:none; }
@keyframes logIn { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:none; } }
/* zaman çizelgesi */
.st-tl { list-style:none; margin:18px 0 0; padding:0; display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:10px; position:relative; }
.st-tl .bar { position:absolute; left:12px; right:12px; top:11px; height:3px; border-radius:3px; background:var(--line); }
.st-tl .bar i { position:absolute; left:0; top:0; bottom:0; width:0; border-radius:3px; background:linear-gradient(90deg, var(--crit), var(--mid) 60%, var(--ok)); transition:width .8s cubic-bezier(.3,.7,.3,1); }
.st-tl li { position:relative; z-index:1; min-width:0; }
.st-tl button { display:grid; gap:3px; width:100%; padding:0; border:0; background:none; text-align:left; cursor:pointer; color:var(--ink); }
.st-tl .dt { width:25px; height:25px; border-radius:50%; background:var(--card); border:2px solid var(--line2); display:grid; place-items:center; transition:all .35s; margin-bottom:8px; }
.st-tl .dt::after { content:""; width:7px; height:7px; border-radius:50%; background:var(--line2); transition:background .35s; }
.st-tl .t { font:700 12px "JetBrains Mono", ui-monospace, monospace; color:var(--mute); }
.st-tl b { font:700 14.5px/1.3 Figtree, system-ui, sans-serif; }
.st-tl small { color:var(--mute); font-size:13px; line-height:1.4; }
.st-tl li.done .dt { border-color:var(--pri); } .st-tl li.done .dt::after { background:var(--pri); }
.st-tl li.on .dt { border-color:var(--crit); box-shadow:0 0 0 5px color-mix(in srgb, var(--crit) 18%, transparent); } .st-tl li.on .dt::after { background:var(--crit); }
.st-tl li.on .t { color:var(--crit); }
.st-tl li:last-child.on .dt { border-color:var(--ok); box-shadow:0 0 0 5px color-mix(in srgb, var(--ok) 20%, transparent); } .st-tl li:last-child.on .dt::after { background:var(--ok); } .st-tl li:last-child.on .t { color:var(--ok); }
.st-tl li:not(.on):not(.done) b, .st-tl li:not(.on):not(.done) small { opacity:.55; }
.st-tl button:hover b { color:var(--priInk); }
@media (max-width:1080px) {
  .st-body { grid-template-columns:minmax(0, .9fr) minmax(0, 1fr); }
  .st-unit { grid-column:1 / -1; }
  .st-tl { grid-template-columns:repeat(3, minmax(0, 1fr)); row-gap:18px; } .st-tl .bar { display:none; }
}
@media (max-width:640px) {
  .story { padding:12px; border-radius:20px; }
  .st-top { flex-wrap:wrap; gap:10px; padding-bottom:12px; margin-bottom:12px; }
  .st-cap { order:3; flex:1 1 100%; font-size:15px; }
  .st-replay { margin-left:auto; }
  .st-body { grid-template-columns:minmax(0, 1fr); gap:12px; }
  .st-unit { grid-column:auto; }
  .st-beds { gap:6px; } .sb2 { padding:7px 7px 6px; } .sb2 .v b { font-size:15px; } .sb2 svg { height:20px; }
  .st-ph .mph { max-width:190px; }
  .st-tl { grid-template-columns:minmax(0, 1fr); gap:10px; padding-left:4px; }
  .st-tl::before { content:""; position:absolute; left:15px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .st-tl button { grid-template-columns:25px auto minmax(0, 1fr); column-gap:10px; align-items:start; }
  .st-tl .dt { grid-row:1 / span 2; margin:0; }
  .st-tl .t { padding-top:4px; } .st-tl b { grid-column:3; grid-row:1; padding-top:2px; } .st-tl small { grid-column:2 / -1; }
}
@media (prefers-reduced-motion: reduce) { .story *, .story::before { animation:none !important; transition:none !important; } }
.note { display:flex; align-items:center; gap:10px; margin-top:22px; color:var(--mute); font-size:14.5px; }
.note svg.i { color:var(--ok); }

/* roller */
.roles { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:14px; }
.role { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:8px; transition:border-color .2s, transform .2s; }
.role:hover { border-color:var(--pri); transform:translateY(-2px); }
.role .ic { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--priSoft); color:var(--priInk); }
.role .ic svg.i { width:20px; height:20px; }
.role h3 { font-size:17px; }
.role p { margin:0; color:var(--mute); font-size:14px; }
.nn { margin-top:auto; align-self:flex-start; display:inline-flex; align-items:center; gap:6px; font:700 11.5px Figtree, system-ui, sans-serif; color:var(--mute); border:1px dashed var(--line2); border-radius:999px; padding:3px 9px; }
.nn svg.i { width:13px; height:13px; }
.role.anon .ic { background:var(--card2); color:var(--mute); }

/* güven — 30.09: "Sınırları baştan belli." Dört kart; her birinin altında kırmızı "yapmaz" satırı */
.trustg { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:16px; }
.tc { position:relative; display:flex; flex-direction:column; gap:10px; background:var(--page); border:1px solid var(--line); border-radius:20px; padding:24px 22px 20px; transition:border-color .2s, transform .2s, box-shadow .2s; }
[data-theme="gece"] .tc { background:#07101f; }
.tc:hover { transform:translateY(-3px); border-color:color-mix(in srgb, var(--pri) 45%, transparent); box-shadow:var(--shadowS); }
.tc .ic { width:48px; height:48px; border-radius:14px; display:grid; place-items:center; background:var(--priSoft); color:var(--priInk); }
.tc .ic svg.i { width:24px; height:24px; }
.tc h3 { font-size:19px; line-height:1.25; margin-top:6px; }
.tc p { margin:0; color:var(--mute); font-size:14.5px; }
.tc .no { margin-top:auto; display:flex; gap:8px; align-items:flex-start; padding-top:14px; border-top:1px dashed var(--line2); color:var(--crit); font:700 13.5px/1.4 Figtree, system-ui, sans-serif; }
.tc .no svg.i { width:16px; height:16px; margin-top:1px; flex:none; stroke-width:2.6; }

/* mobil uygulama · yakında (30.09) */
.mob { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.05fr); gap:clamp(32px, 5vw, 88px); align-items:center; }
.mb-soon { display:inline-flex; align-items:center; gap:6px; margin-left:4px; padding:2px 8px; border-radius:999px; background:var(--priSoft); color:var(--priInk); font:700 11px Figtree, system-ui, sans-serif; letter-spacing:.04em; text-transform:none; }
.mb-list { list-style:none; margin:30px 0 0; padding:0; display:grid; gap:12px; max-width:560px; }
.mb-list li { display:flex; gap:14px; align-items:center; padding:14px 16px; border-radius:16px; background:var(--card); border:1px solid var(--line); transition:border-color .2s, transform .2s; }
.mb-list li:hover { border-color:var(--pri); transform:translateX(3px); }
.mb-list .ic { width:44px; height:44px; border-radius:13px; display:grid; place-items:center; background:var(--priSoft); color:var(--priInk); flex:none; }
.mb-list .ic svg.i { width:21px; height:21px; }
.mb-list li:first-child .ic { background:var(--critSoft); color:var(--crit); }
.mb-list b { display:block; font-size:16px; } .mb-list span { display:block; color:var(--mute); font-size:14px; }
.stores { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
.store { display:inline-flex; align-items:center; gap:11px; height:56px; padding:0 20px 0 14px; border-radius:14px; background:#0b0f16; color:#fff; border:1px solid rgba(255,255,255,.16); cursor:default; user-select:none; box-shadow:var(--shadowS); }
[data-theme="gece"] .store { background:#000; border-color:#2a3f60; }
.store svg { width:26px; height:26px; flex:none; }
.store span { display:grid; line-height:1.1; }
.store small { font:600 10.5px Figtree, system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; color:#b9c6d4; }
.store b { font:600 19px Figtree, system-ui, sans-serif; letter-spacing:-.01em; }
.mb-vis { position:relative; min-height:640px; perspective:2000px; }
.mb-vis::before { content:""; position:absolute; left:8%; right:8%; top:10%; bottom:6%; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--pri) 28%, transparent), transparent); filter:blur(30px); z-index:0; }
.mb-vis .dv { position:absolute; z-index:1; --pw:clamp(200px, 16vw, 262px); width:var(--pw); }
.mb-vis .dv.and { left:8%; top:0; animation:hpf 8s ease-in-out -3s infinite; }
.mb-vis .dv.ios { right:8%; top:70px; z-index:2; animation:hpf 7s ease-in-out infinite; }

/* pilot */

.pilot::before { content:""; position:absolute; width:420px; height:420px; right:-160px; top:-200px; border-radius:50%; background:#22b8d6; filter:blur(70px); opacity:calc(var(--glowOp) * .8); z-index:-1; }
.pl { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.pl li { display:flex; align-items:center; gap:14px; padding:14px 16px; border:1px solid var(--line); border-radius:14px; background:var(--page); font-weight:700; }

[data-theme="gece"] .pc { background:#07101f; }

.pc h3 { font-size:18px; margin-bottom:6px; } .pc p { margin:0; color:var(--mute); font-size:14.5px; }

/* bugün sistemde olanlar: üç sütun (hekim · hemşire · kurum) */
.feat { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:18px; }
.fg { background:var(--page); border:1px solid var(--line); border-radius:20px; padding:22px 22px 12px; display:flex; flex-direction:column; }

.fg-h { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.fg-h .ic { width:44px; height:44px; border-radius:13px; display:grid; place-items:center; background:var(--pri); color:var(--onpri); flex:none; }

.fi b { display:block; font-size:15px; } .fi span { display:block; color:var(--mute); font-size:13.5px; line-height:1.45; }

/* birimler */
.units { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:16px; }
.un { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadowS); }
.un.big { grid-column:span 3; flex-direction:row; align-items:center; gap:22px; background:linear-gradient(120deg, var(--priSoft), var(--card) 60%); }

.yn .b { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; }
.yn .y .b { background:var(--okSoft); } .yn .n .b { background:var(--critSoft); }
.yn .b svg.i { width:14px; height:14px; }
.row { display:flex; gap:12px; padding:13px 0; border-top:1px solid var(--line); }

.ft { position:relative; background:#062530; color:#d7e7ee; padding:0; margin-top:0; }

.ft-cta { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:20px 32px; padding:40px 0 44px; border-bottom:1px solid rgba(215,231,238,.12); }

.ft .btn.p { background:#22b8d6; border-color:#22b8d6; color:#03141c; }
.ft .btn.ghost { background:transparent; color:#fff; border-color:rgba(215,231,238,.3); }
.ft .btn.ghost:hover { border-color:#22b8d6; }
.ft-top { display:grid; grid-template-columns:minmax(0, 1.6fr) minmax(0, .8fr) minmax(0, .8fr); gap:36px; padding:44px 0 40px; }
.ft-col[hidden] { display:none; }
.ft .brand, .ft .brand b { color:#fff; }
.ft .mk { background:#22b8d6; color:#03141c; box-shadow:none; }
.ft-brand p { color:#9fbac6; font-size:14.5px; max-width:400px; margin:14px 0 18px; }

.ft-chips a { display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px; border:1px solid rgba(215,231,238,.16); font-size:13.5px; line-height:20px; }

/* çerez şeridi: altta tam genişlik, engellemez. Takip çerezi olmadığı için "kabul / reddet" seçimi yok —
   sorulacak bir şey yok; yalnız bilgi verilir. 15 sn sonra kendiliğinden kapanır, üstündeyken bekler. */
.ck { position:fixed; left:0; right:0; bottom:0; z-index:70; background:color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--line2); box-shadow:0 -10px 30px rgba(20,30,50,.08); animation:ckUp .35s ease-out; }
@keyframes ckUp { from { transform:translateY(100%); } to { transform:none; } }
.ck[hidden] { display:none; }
.ck.out { transform:translateY(110%); transition:transform .35s ease-in; }
.ck-in { display:flex; align-items:center; gap:14px; padding-top:14px; padding-bottom:14px; }
.ck-ic { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:var(--priSoft); color:var(--priInk); flex:none; }
.ck-ic svg.i { width:18px; height:18px; }
.ck p { margin:0 auto 0 0; font-size:13.5px; color:var(--mute); line-height:1.45; }
.ck p b { display:block; color:var(--ink); font-size:14px; }
.ck .btn { height:38px; padding:0 16px; flex:none; }
.ck-bar { position:absolute; left:0; top:-1px; height:2px; width:100%; background:var(--pri); transform-origin:0 50%; transform:scaleX(1); }
@media (max-width:760px) { .ck-in { flex-wrap:wrap; } .ck p { flex:1 1 calc(100% - 52px); } .ck .btn { flex:1; } }
/* yukarı çık */
.totop { position:fixed; right:18px; bottom:18px; z-index:60; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--card); border:1px solid var(--line2); color:var(--ink); box-shadow:var(--shadowS); opacity:0; transform:translateY(10px); pointer-events:none; transition:opacity .2s, transform .2s; }
.totop.on { opacity:1; transform:none; pointer-events:auto; }
.totop:hover { border-color:var(--pri); color:var(--pri); }

/* görünür olunca yumuşak giriş */
.rv { opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s ease; }
.rv.in { opacity:1; transform:none; }
@keyframes up { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }


/* ---------- gerçek ekran + odak (24.09 kararı: "Görsel: C") ----------
   Prototipten çekilmiş ekran; anlatılan parça keskin ve büyütülmüş, gerisi bulanık ve soluk.
   --x/--y/--w/--h = odak kutusu, görüntünün kesri (0–1). Görüntü 1344×900 (oran 0.6696), çerçeve 16/10. */
.shot { position:relative; aspect-ratio:16/10; overflow:hidden; container-type:inline-size; border-radius:12px; border:1px solid var(--line); background:var(--card2);
  --s:max(1, calc(.86 / var(--w)));
  --L:clamp(calc(100cqw - var(--s) * 100cqw), calc(50cqw - (var(--x) + var(--w) / 2) * var(--s) * 100cqw), 0cqw);
  --T:clamp(calc(62.5cqw - var(--s) * 66.96cqw), calc(31.25cqw - (var(--y) + var(--h) / 2) * var(--s) * 66.96cqw), 0cqw); }
.shot img { position:absolute; max-width:none; width:calc(var(--s) * 100cqw); height:auto; left:var(--L); top:var(--T); transition:filter .35s, opacity .35s; }
.shot .sb { filter:blur(2.2px) saturate(.6); opacity:.5; }
.shot .sf { clip-path:inset(calc(var(--y) * 100%) calc((1 - var(--x) - var(--w)) * 100%) calc((1 - var(--y) - var(--h)) * 100%) calc(var(--x) * 100%) round 8px); }
.shot .ring { position:absolute; pointer-events:none; border-radius:9px; box-shadow:0 0 0 2px var(--pri), 0 10px 30px rgba(14,116,144,.25);
  left:calc(var(--L) + var(--x) * var(--s) * 100cqw); top:calc(var(--T) + var(--y) * var(--s) * 66.96cqw);
  width:calc(var(--w) * var(--s) * 100cqw); height:calc(var(--h) * var(--s) * 66.96cqw); }
.shot:hover .sb { filter:blur(0) saturate(1); opacity:.9; }
@media (prefers-reduced-motion: reduce) { .shot img { transition:none; } }
.pc { display:flex; flex-direction:column; } .pc .ans { margin-top:auto; padding-top:16px; }
.pc .ans .lb { display:flex; align-items:center; gap:6px; font:700 11px Figtree, system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--priInk); margin-bottom:8px; }
.pc .ans .lb::before { content:""; width:12px; height:2px; background:currentColor; }
.pc h3 { display:flex; gap:9px; align-items:baseline; } .pc h3::before { content:""; flex:none; width:8px; height:8px; border-radius:50%; background:var(--crit); transform:translateY(-2px); }
.step .shot { margin:14px 0 16px; }
/* 28.09 (#218): abstract schematics instead of screenshots — no data, no internal layout (#194). */
section[hidden], .anc[hidden] { display:none !important; }
.shot.abs { display:grid; place-items:center; }
.shot.abs svg { width:86%; height:auto; }
.step.mid h3 { display:flex; align-items:center; gap:8px; } .step.mid h3 i { font:700 13px "Space Grotesk", system-ui, sans-serif; font-style:normal; width:24px; height:24px; border-radius:7px; display:grid; place-items:center; background:#0e7490; color:#fff; }
.un .shot { margin-bottom:6px; }
.un.big .shot { flex:0 0 46%; margin:0; }
.un.big > div:not(.shot) { flex:1; }
.role .shot { margin-bottom:4px; border-radius:10px; }
@media (max-width:1080px) { .probs { grid-template-columns:repeat(2, minmax(0, 1fr)); } .un.big { flex-direction:column; align-items:stretch; } .un.big .shot { flex:none; } }
@media (max-width:560px) { .probs, .units { grid-template-columns:1fr; } .un.big { grid-column:auto; } }


/* 30.09 · kahraman sahnesi (Ozan, 3. tur — ara sürüme dönüş): canlı birim kartı + sağ kenarına binen TEK büyük, eğik telefon
   (iPhone tarzı çerçeve, gerçek hasta kartı + monitör paneli), altında "Mobil uygulama · yakında" çipi, sağ kenarda nabız rozeti.
   Sahne "nasıl çalışır"ı anlatır: REA03 96→86 kayar, zincir basamak basamak yanar. */
.stage { --pw:clamp(214px, 15.6vw, 292px); position:relative; padding:44px 0; }
.stage::before { content:""; position:absolute; right:-4%; top:4%; width:58%; height:92%; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--pri) 30%, transparent), transparent); filter:blur(24px); z-index:0; pointer-events:none; }
.stage .scene { position:relative; z-index:1; margin-right:calc(var(--pw) - 34px); }
.hphone { position:absolute; right:0; top:50%; z-index:2; width:var(--pw); transform:translateY(-50%); perspective:1600px; }
.hphone .tilt { transform:rotateY(-16deg) rotateX(4deg) rotateZ(2.5deg); transform-origin:60% 50%; }
.hphone .dv { width:100%; animation:hpf 7s ease-in-out infinite; }
@keyframes hpf { 0%, 100% { translate:0 0; } 50% { translate:0 -8px; } }
.hp-cap { position:absolute; left:-30px; bottom:7%; z-index:4; display:flex; align-items:center; gap:8px; padding:8px 12px 8px 8px; border-radius:14px; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); font:700 12px Figtree, system-ui, sans-serif; color:var(--ink); white-space:nowrap; text-decoration:none; transition:border-color .2s, transform .2s; }
.hp-cap:hover { border-color:var(--pri); transform:translateY(-2px); }
.hp-cap i { width:26px; height:26px; border-radius:8px; display:grid; place-items:center; background:var(--priSoft); color:var(--priInk); font-style:normal; }
.hp-cap i svg.i { width:14px; height:14px; }
/* nabız rozeti: telefonun sağ kenarında, kritik evrede kırmızı */
.hp-pulse { position:absolute; right:-16px; top:28%; z-index:4; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--card); color:var(--pri); border:1px solid var(--line); box-shadow:var(--shadowS); animation:hpp 1.8s ease-out infinite; transition:background .3s, color .3s; }
.hp-pulse svg.i { width:17px; height:17px; }
@keyframes hpp { from { box-shadow:0 0 0 0 color-mix(in srgb, var(--pri) 45%, transparent), var(--shadowS); } to { box-shadow:0 0 0 12px transparent, var(--shadowS); } }
.stage.al .hp-pulse { background:#ef4444; color:#fff; border-color:#ef4444; animation-name:hppc; }
@keyframes hppc { from { box-shadow:0 0 0 0 rgba(239,68,68,.55); } to { box-shadow:0 0 0 14px rgba(239,68,68,0); } }
/* telefonun üstüne düşen bildirim: sahnede "hemşireye haber" evresinde */
.hpush { position:absolute; left:7%; right:7%; top:8%; z-index:5; display:grid; gap:2px; padding:7px 9px; border-radius:12px; background:rgba(15,27,46,.95); color:#fff; box-shadow:0 12px 30px rgba(0,0,0,.35); transform:translateY(-30%); opacity:0; transition:transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .3s; pointer-events:none; }
.hpush .fp-app { display:flex; align-items:center; gap:5px; font:700 9.5px Figtree, system-ui, sans-serif; color:#cfe3ea; }
.hpush .fp-app i { width:14px; height:14px; border-radius:4px; background:#0e7490; color:#fff; font:700 8.5px "Space Grotesk", system-ui, sans-serif; font-style:normal; display:grid; place-items:center; }
.hpush .fp-app em { margin-left:auto; font-style:normal; font-weight:600; color:#9fb6c3; }
.hpush b { font:700 11px/1.25 Figtree, system-ui, sans-serif; }
.stage.push .hpush { transform:none; opacity:1; }
.stage.al .hphone .dv.ios { filter:drop-shadow(0 0 12px rgba(239,68,68,.45)); }

/* ---- iki cihaz: saf CSS, marka logosu yok. Ekran = durum çubuğu + ekran görüntüsü (390×844 oranında, kırpılmaz) ---- */
.dv { position:relative; --scr:#f4f6fa; --ink2:#152231; }
[data-theme="gece"] .dv { --scr:#07101f; --ink2:#e8eef7; }

    [].slice.call(sTl.querySelectorAll("li[data-k]")).forEach(function (li) { var k = +li.getAttribute("data-k"); li.classList.toggle("done", k < step); li.classList.toggle("on", k === step); });
    storyBar(step);
    sCap.textContent = t(p[2]); sCap.className = "st-cap" + (p[3] ? " " + p[3] : "");
    if (anim) { void sCap.offsetWidth; sCap.classList.add("in"); }
  }
  function storyNext() { sp = (sp + 1) % SPH.length; storyPaint(true); storySched(); }
  function storySched() { clearTimeout(sTimer); if (sVisible && !reduced && Date.now() >= sHold) sTimer = setTimeout(storyNext, SDUR[sp]); }
  function storyGo(k, hold) { clearTimeout(sTimer); sp = k; storyPaint(true); if (hold) { sHold = Date.now() + hold; setTimeout(storySched, hold + 50); } else { sHold = 0; storySched(); } }
  if (story) {
    if (reduced) { sp = SPH.length - 1; storyPaint(false); }
    else storyPaint(false);
    sTl.addEventListener("click", function (e) { var li = e.target.closest("li[data-k]"); if (li) storyGo(+li.getAttribute("data-k") + 1, 9000); });
    story.querySelector("[data-st-replay]").addEventListener("click", function () { storyGo(0, 0); });
    if (!reduced && "IntersectionObserver" in window) {
      new IntersectionObserver(function (es) { es.forEach(function (en) { sVisible = en.isIntersecting; if (sVisible) storySched(); else clearTimeout(sTimer); }); }, { threshold:.3 }).observe(story);
    }
    window.addEventListener("resize", function () { storyBar(SPH[sp][1]); });
  }

  /* dil menüsü, tema, telefon menüsü */
  var lsel = null, lmenu = null, hdr = document.querySelector(".hdr"), mnav = document.querySelector("[data-mnav]");
  function setMenu(open, btn) { if (!open && !lmenu) return; if (btn) { lsel = btn; lmenu = btn.parentNode.querySelector(".lmenu"); } document.querySelectorAll(".lmenu").forEach(function (m) { if (m !== lmenu) m.hidden = true; }); lmenu.hidden = !open; lsel.setAttribute("aria-expanded", String(open)); if (open) { var on = lmenu.querySelector(".on"); if (on) on.focus(); } }
  function setNav(open) { hdr.classList.toggle("open", open); mnav.setAttribute("aria-expanded", String(open)); mnav.innerHTML = svg(open ? "x" : "menu"); }
  document.addEventListener("click", function (e) {
    var lb = e.target.closest("[data-lsel]"); if (lb) { e.preventDefault(); var m = lb.parentNode.querySelector(".lmenu"); return setMenu(m.hidden, lb); }
    var lg = e.target.closest("[data-lang]");
    if (lg) { st.lang = lg.getAttribute("data-lang"); save("lang", st.lang); setMenu(false); applyLang(); if (lsel) lsel.focus(); return; }
    if (lmenu && !lmenu.hidden && !e.target.closest(".lmenu")) setMenu(false);
    if (e.target.closest("[data-theme-btn]")) { st.theme = st.theme === "gece" ? "gun" : "gece"; save("theme", st.theme); applyTheme(); return; }
    if (e.target.closest("[data-mnav]")) return setNav(!hdr.classList.contains("open"));
    if (e.target.closest(".mpanel a")) setNav(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (lmenu && !lmenu.hidden) { setMenu(false); lsel.focus(); } if (hdr.classList.contains("open")) setNav(false); }
    if (lmenu && !lmenu.hidden && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); var o = [].slice.call(lmenu.querySelectorAll(".lopt")), i = o.indexOf(document.activeElement); o[(i + (e.key === "ArrowDown" ? 1 : -1) + o.length) % o.length].focus(); }
  });
  var prog = document.querySelector("[data-prog]"), totop = document.querySelector("[data-totop]");
  var navA = [].slice.call(document.querySelectorAll(".nav a")), secs = navA.map(function (a) { var x = document.getElementById(a.getAttribute("href").slice(1)); return x && x.classList.contains("anc") ? x.nextElementSibling : x; });
  function onScroll() {
    var y = window.scrollY, h = document.documentElement.scrollHeight - window.innerHeight;
    hdr.classList.toggle("sc", y > 8);
    prog.style.transform = "scaleX(" + (h > 0 ? Math.min(1, y / h) : 0) + ")";
    totop.classList.toggle("on", y > window.innerHeight * 0.9);
    var cur = -1; secs.forEach(function (s, i) { if (s && !s.hidden && s.getBoundingClientRect().top < 140) cur = i; });
    navA.forEach(function (a, i) { a.classList.toggle("on", i === cur); });
  }
  window.addEventListener("scroll", onScroll, { passive:true }); onScroll();
  /* logo, "yukarı" düğmesi ve #top bağlantıları: sayfanın en başına, adres çubuğunda # bırakmadan */
  document.addEventListener("click", function (e) { var a = e.target.closest('a[href="#top"]'); if (!a) return; e.preventDefault(); window.scrollTo({ top:0, behavior:reduced ? "auto" : "smooth" }); try { history.replaceState(null, "", location.pathname + location.search); } catch (x) {} if (hdr.classList.contains("open")) setNav(false); });
  /* menüde kayan gösterge: etkin bölümün altına yumuşakça gider */
  var ind = document.querySelector(".nav-ind");
  function moveInd() { var on = document.querySelector(".nav a.on"); if (!on || !ind) { if (ind) ind.style.opacity = 0; return; } ind.style.opacity = 1; ind.style.width = on.offsetWidth + "px"; ind.style.transform = "translateX(" + on.offsetLeft + "px)"; }
  window.addEventListener("scroll", moveInd, { passive:true }); window.addEventListener("resize", moveInd); setTimeout(moveInd, 60);

  /* çerez bilgi notu: bir kez; "Tamam" hmc.cookieNote'a yazılır (app/legal.js Çerezler listesinde) */
  var ck = document.querySelector("[data-ck]"), ckSeen = false;
  try { ckSeen = localStorage.getItem("hmc.cookieNote") === "1"; } catch (e) {}
  var ckBar = document.querySelector("[data-ck-bar]"), ckLeft = 15000, ckLast = 0, ckRaf = 0, ckHold = false;
  function ckClose() { cancelAnimationFrame(ckRaf); save("cookieNote", "1"); ck.classList.add("out"); setTimeout(function () { ck.hidden = true; }, 380); totop.style.bottom = ""; }
  function ckTick(ts) { if (!ckLast) ckLast = ts; if (!ckHold && !document.hidden) ckLeft -= ts - ckLast; ckLast = ts; ckBar.style.transform = "scaleX(" + Math.max(0, ckLeft / 15000) + ")"; if (ckLeft <= 0) return ckClose(); ckRaf = requestAnimationFrame(ckTick); }
  if (!ckSeen) setTimeout(function () { ck.hidden = false; totop.style.bottom = (ck.offsetHeight + 14) + "px"; if (reduced) ckBar.style.display = "none"; ckRaf = requestAnimationFrame(ckTick); }, 1200);
  ck.addEventListener("mouseenter", function () { ckHold = true; }); ck.addEventListener("mouseleave", function () { ckHold = false; });
  ck.addEventListener("focusin", function () { ckHold = true; }); ck.addEventListener("focusout", function () { ckHold = false; });
  document.querySelector("[data-ck-ok]").addEventListener("click", ckClose);

  /* parçalar: ürün turu ve nöbet. Yüklenene kadar bölüm gizli — yarım bölüm görünmesin */
  // 28.09 (#218): "nobet" (24 saat) and "neler" are hidden on the short page, so their parts are not
  // loaded — loading them would unhide the sections again. Add them back here together with `hidden`.
  [["tur", "parca/tur.js"]].forEach(function (p) {
    var sec = document.getElementById(p[0]); sec.hidden = true;
    var sc = document.createElement("script"); sc.src = p[1] + "?v=" + Date.now();
    sc.onload = function () { if (document.getElementById(p[0] + "-mount").children.length) { sec.hidden = false; sec.querySelectorAll(".rv").forEach(function (x) { x.classList.add("in"); }); try { document.dispatchEvent(new CustomEvent("hmc:lang", { detail:st.lang })); } catch (e) {} } };
    document.body.appendChild(sc);
  });

  /* görünür olunca yumuşak giriş (hareket azaltılmışsa hepsi baştan görünür) */
  var rv = [].slice.call(document.querySelectorAll(".rv"));
  if (reduced || !("IntersectionObserver" in window)) rv.forEach(function (x) { x.classList.add("in"); });
  else { var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }); }, { rootMargin:"0px 0px -8% 0px" }); rv.forEach(function (x) { io.observe(x); }); }

  applyLang();
})();
</script>
</body>
</html>
