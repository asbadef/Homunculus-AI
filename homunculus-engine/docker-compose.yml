services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: homunculus
      POSTGRES_PASSWORD: homunculus
      POSTGRES_DB: homunculus
    ports:
      - "127.0.0.1:5432:5432"  # D2: yalnızca bu bilgisayar
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
