# Render Blueprint — Homunculus backend (FastAPI) → Supabase Postgres.
# Frontend stays on Vercel; this deploys ONLY the API. On every push to the connected branch Render
# rebuilds, runs `alembic upgrade head` (schema migrations against Supabase), and restarts uvicorn.
#
# Secrets are entered in the Render dashboard (sync:false / generateValue), never committed:
#   DATABASE_URL   Supabase "Session pooler" URI, driver rewritten to postgresql+asyncpg://
#                  e.g. postgresql+asyncpg://postgres.<ref>:<PWD>@aws-0-<region>.pooler.supabase.com:5432/postgres
#   CORS_ORIGINS   the Vercel origin, e.g. https://homunculus-ai.vercel.app
#   TENANTS        the bridge's device token and the tenant slug: <openssl rand -base64 36>:<tenant slug>
#                  The slug must be the tenant's slug (the seed creates demo-hastanesi); any other
#                  key, e.g. HOSP1, matches no clinician's board. REQUIRED: without it the API
#                  refuses to start.
#   PHI_ENCRYPTION_KEY  Fernet key for patient identities at rest (44 characters of url-safe
#                  base64). REQUIRED: without it, or with a malformed one, the API refuses to start.
#                  Generate once, keep it with the database backups: rows written under one key
#                  cannot be read under another.
#                  python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#
# PLAN — ACTION REQUIRED BEFORE ANY DEVICE IS CONNECTED.
#
# `free` sleeps after ~15 minutes of inactivity, and while it sleeps the BACKGROUND ESCALATION LOOP
# DOES NOT RUN: an unacknowledged alert sits unescalated until some unrelated request happens to
# wake the service. Escalation exists to fire when nobody is looking — which is precisely when a
# sleeping service is asleep. It also costs the first visitor a ~50s cold start.
#
# The intended value is `starter` (always-on). It is left at `free` only because Render refuses the
# upgrade with "Plan requires payment information on file". Add a payment method in the Render
# dashboard, then change this line to `starter` and redeploy. Do not connect a device to a `free`
# service and rely on its alerting.
services:
  - type: web
    name: homunculus-api
    runtime: python
    plan: free
    rootDir: homunculus-engine
    buildCommand: pip install -e .
    # Migrate, then bootstrap the first admin (idempotent; skips when SEED_ADMIN_PASSWORD is unset,
    # so restarts keep working after the operator removes it), then serve.
    startCommand: alembic upgrade head && python scripts/seed_admin.py && uvicorn homunculus.api.prodserver:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: TENANTS
        sync: false
      # Patient identities are encrypted with this; see the header. Required on Postgres.
      - key: PHI_ENCRYPTION_KEY
        sync: false
      # Bootstrap admin — set for the first deploy, then remove. The address becomes the admin's
      # username and e-mail. A NEW admin needs a password of at least 12 characters that is not a
      # known placeholder (change-me, password, ...); otherwise the seed skips it and logs why.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Audit goes to Postgres whenever DATABASE_URL is set (see prodserver._audit); this path is only
      # the fallback for running without a database. Render's filesystem is ephemeral, so a SQLite
      # audit there would be discarded on every deploy while still looking like a record.

      - key: AUDIT_DB_PATH
        value: /tmp/homunculus-audit.db
