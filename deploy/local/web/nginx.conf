# Serves the dashboard and reverse-proxies the API, so the frontend and API share one origin.
#
# That is the point of this container. The dashboard is built WITHOUT VITE_API_URL, so
# defaultBaseUrl() returns "" and every request goes to the page's own origin. There is no
# build-time API address that can be wrong — which is exactly how the Vercel deployment broke.

# Sign-in attempts per client address (see `location = /auth/login`). Top level of this file on
# purpose: it is installed as conf.d/default.conf, which nginx includes inside `http {}`.
limit_req_zone $binary_remote_addr zone=homunculus_login:10m rate=10r/m;
# Screen unlocks and password changes per client address (see `location = /auth/reauth`): a zone
# of their own, so a ward's unlocks never spend its sign-ins.
limit_req_zone $binary_remote_addr zone=homunculus_reauth:10m rate=30r/m;

# ACCESS LOG WITHOUT PATIENT KEYS (G2-B1d O10). The patient screen's routes carry the board key in the
# path (/patients/<key>/trends, /scores/sofa/<key>: the protocol number; the H-number before B1d), and
# nginx's stock log writes the whole request line, the query string and the referer (the dashboard
# page's address). `homunculus_redacted` (below) writes none of them: the path comes from this map,
# which replaces every route parameter by a placeholder — `:key` for a patient's key, `:id` for any
# other id — and the query string is not logged at all. Top level of this file on purpose, as the zones
# above: `map` and `log_format` belong to `http {}`.
#
# Matching, as nginx does it: an exact string first, then the regular expressions in the order written
# here — the FIRST match wins — then `default`. So the precise entries come first and the catch-all,
# which collapses anything else below a prefix that carries a key (a typo, a probe, a key with an
# encoded slash, a route added later) to `<prefix>:redacted`, comes last. nginx logs a request whatever
# the API answers, a 404 included.
#
# THE LIST IS HAND-WRITTEN AND THE ROUTE TABLE IS CODE: a route added with a path parameter needs an
# entry here, and tests/test_access_log_redaction.py fails until it has one (it walks the app's
# routes). The dashboard routes by the URL fragment (#/patients/<key>), which a browser never sends,
# so none of its screens reach this log with a key.
#
# NOT COVERED: nginx's error_log. On an upstream failure (the API down: 502) its line carries the
# request, `request: "GET /patients/<key>/trends HTTP/1.1"`, and an error_log line cannot be
# formatted. It is left at its level on purpose: raising it would hide real faults. See the O10 spec.
map $uri $homunculus_log_uri {
    default                                                  $uri;

    # No parameter: logged as they are. Listed so the catch-all below does not take them.
    ~^/scope/(?:me|unassigned)$                              $uri;
    ~^/alerts/rrt-call$                                      $uri;   # G2-B5: «RRT çağır» (the key is in the body)
    ~^/tasks/settings$                                       $uri;

    # A patient's key (protocol number / H-number): :key
    ~^/patients/[^/]+/trends$                                /patients/:key/trends;
    ~^/alerts/[^/]+$                                         /alerts/:key;
    ~^/clinical/[^/]+$                                       /clinical/:key;
    ~^/clinical/[^/]+/profile$                               /clinical/:key/profile;
    ~^/clinical/[^/]+/preview$                               /clinical/:key/preview;
    ~^/clinical/[^/]+/entries/[^/]+/retract$                 /clinical/:key/entries/:id/retract;
    ~^/scores/sofa/[^/]+$                                    /scores/sofa/:key;
    ~^/scores/sofa/[^/]+/preview$                            /scores/sofa/:key/preview;
    ~^/tasks/vitals/[^/]+/skip$                              /tasks/vitals/:key/skip;

    # Any other record's id: :id
    ~^/admin/(?<res>groups|users)/[^/]+$                     /admin/$res/:id;
    ~^/admin/users/[^/]+/(?<act>groups|reset-mfa|reset-password|unlock-sign-in)$   /admin/users/:id/$act;
    ~^/admin/ldap/group-mappings/[^/]+$                      /admin/ldap/group-mappings/:id;
    ~^/admissions/[^/]+$                                     /admissions/:id;
    ~^/admissions/[^/]+/(?<act>care-team|care-team/claim|discharge/confirm|discharge/initiate|label|patient|sign-off|transfer/confirm|transfer/initiate)$   /admissions/:id/$act;
    ~^/alerts/[^/]+/(?<act>acknowledge|escalate|snooze)$     /alerts/:id/$act;
    ~^/break-glass/[^/]+/(?<act>close|extend)$               /break-glass/:id/$act;
    ~^/handovers/[^/]+/(?<act>countersign|sign-outgoing)$    /handovers/:id/$act;
    # The waves poll (dalga): a monitor's network address, a device id — never a bed label or a
    # patient key. Redacted to :id all the same, as every other id. (The poll is not logged at all:
    # `$homunculus_access_logged`, below.)
    ~^/infinity-waves/[^/]+$                                 /infinity-waves/:id;
    ~^/scope/[^/]+$                                          /scope/:id;
    ~^/tasks/[^/]+/(?<act>claim|done|skip)$                  /tasks/:id/$act;
    ~^/tenant/(?<res>beds|rooms|units)/[^/]+$                /tenant/$res/:id;
    # G2-B3a: + reserve, unreserve, out-of-service, return-to-service (GET /tenant/occupancy has no id).
    ~^/tenant/beds/[^/]+/(?<act>out-of-service|release|reserve|return-to-service|transition|unreserve)$   /tenant/beds/:id/$act;
    ~^/tenant/rooms/[^/]+/beds$                              /tenant/rooms/:id/beds;
    ~^/tenant/sites/[^/]+/units$                             /tenant/sites/:id/units;
    ~^/tenant/tenants/[^/]+/sites$                           /tenant/tenants/:id/sites;
    ~^/tenant/units/[^/]+/rooms$                             /tenant/units/:id/rooms;

    # Anything else below a prefix that carries a key or an id, whole: LAST.
    ~^/(?<pre>patients|clinical|scores/sofa|alerts|admissions|handovers|break-glass|scope|infinity-waves|tasks|admin/users|admin/groups|admin/ldap/group-mappings|tenant/(?:beds|rooms|sites|tenants|units))/.   /$pre/:redacted;
}

# The server's access log (the `access_log` line in the server block below): who asked, when, what for (method, the
# redacted path, protocol), the answer (status, bytes), how long, and the client. Never `$request`,
# `$request_uri`, `$args` or `$http_referer`, nor `$uri` itself: tests/test_access_log_redaction.py
# allows only the variables written here.
log_format homunculus_redacted '$remote_addr [$time_local] "$request_method $homunculus_log_uri $server_protocol" '
                               '$status $body_bytes_sent $request_time "$http_user_agent"';

# THE ONE PATH THE ACCESS LOG LEAVES OUT (dalga, final review M-3): the live waveform panel's poll,
# GET /infinity-waves/<x>, for its volume alone. Every open panel asks about 1.33 times a second, so one
# panel left open would write ~115,000 lines a day. Its path carries no patient key: <x> is a monitor's
# network address, a device id, never a bed label or a patient key (the map above writes it as :id all
# the same). The server's `access_log` writes a request only `if=` this is not 0; nginx's error log
# still records a failed proxy. Keyed on `$uri`, as `$homunculus_log_uri` is, so both read the same
# normalised path. Nothing else is left out: tests/test_access_log_redaction.py allows this one `0`
# and a `default 1`, and tests/test_nginx_routes.py pins it to the waves. The waves' spec and plan:
# docs/superpowers/specs/2026-10-27-infinity-dalga-formu-design.md,
# docs/superpowers/plans/2026-10-27-infinity-dalga-formu.md (Task 16).
map $uri $homunculus_access_logged {
    default                     1;
    ~^/infinity-waves(/|$)      0;
}

server {
    listen 80;
    # HTTPS as well: Chrome disables the Web Notification API on plain-HTTP origins, so the
    # ward's alarm notifications only work when the panel is opened via https://. The
    # certificate is self-signed, minted by /docker-entrypoint.d/10-selfsigned-cert.sh on
    # first start and persisted on the web-certs volume (one browser warning per machine).
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/self.crt;
    ssl_certificate_key /etc/nginx/certs/self.key;
    server_name _;

    # The redacted format (above), on the path nginx:alpine links to stdout: `docker compose logs web`
    # reads it. The only access_log of this file — a `location` that declared its own would replace
    # this one for its requests, and tests/test_access_log_redaction.py allows no second. Every request
    # but the waves poll (`$homunculus_access_logged`, above).
    access_log /var/log/nginx/access.log homunculus_redacted if=$homunculus_access_logged;

    root /usr/share/nginx/html;
    index index.html;

    # Server-Sent Events. These settings are the difference between a live board and one that
    # silently stops updating: nginx buffers proxied responses by default, so event frames pile up
    # in the buffer instead of reaching the browser, and the screen looks merely quiet.
    location ~ ^/(stream|notifications) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Sign-in alone is limited per client address, in front of the API's own per-account AD
    # throttle: one address trying passwords across many accounts is slowed here — 10 a minute,
    # a burst of 10 — and refused with 429 (nginx's default would be 503: "server down"). An
    # exact location wins over the regex ones below; its proxy settings are the API block's.
    # tests/test_nginx_routes.py pins this block.
    location = /auth/login {
        limit_req zone=homunculus_login burst=10 nodelay;
        limit_req_status 429;
        # A refused sign-in is a client over its rate, not a server fault: logged as a warning
        # (nginx's default is `error`).
        limit_req_log_level warn;
        # nginx's own 429 page is HTML; the dashboard reads a JSON `detail`. The API's own 429s
        # (its per-account throttle) pass through untouched: no proxy_intercept_errors.
        error_page 429 = @login_limited;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unlocking a locked screen and changing one's own password: the two places a held token can
    # test the account's password. The API counts the wrong ones per account; this slows one
    # address asking at all — 30 a minute, a burst of 30: generous, because a ward's PCs share
    # one address behind NAT, and a whole shift unlocks at once. Refused as a limited sign-in is
    # — JSON, Retry-After — in words of its own (`@reauth_limited`): this is no sign-in.
    # tests/test_nginx_routes.py pins these blocks.
    location = /auth/reauth {
        limit_req zone=homunculus_reauth burst=30 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @reauth_limited;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth/password {
        limit_req zone=homunculus_reauth burst=30 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @reauth_limited;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The limited sign-in's answer in the API's shape, {"detail": "…"} as UTF-8 JSON, so the
    # dashboard shows this sentence (dashboard/src/clinicalI18n.js maps it; its i18n test reads
    # it from here) instead of a generic failure.
    location @login_limited {
        default_type "application/json; charset=utf-8";
        # The zone refills at 10 a minute: say when to try again (`always`, or nginx would not
        # add it to an error status).
        add_header Retry-After 60 always;
        return 429 '{"detail":"Çok fazla giriş denemesi; bir dakika sonra tekrar deneyin"}';
    }

    # The limited unlock's or password change's answer, in the same shape: "too many attempts",
    # not "too many sign-in attempts" (clinicalI18n.js maps it too; its i18n test reads it here).
    location @reauth_limited {
        default_type "application/json; charset=utf-8";
        # The zone refills at 30 a minute; a minute is the plain promise, as the words say.
        add_header Retry-After 60 always;
        return 429 '{"detail":"Çok fazla deneme. Bir dakika sonra yeniden deneyin."}';
    }

    # Aşama A: the hub forwarder's POST of the monitor strip's values, with its own bearer token.
    # HTTPS only: this server also listens in the clear (:8080 on the VM), and that port must never
    # carry the token — a plain-HTTP request is refused here, before the API sees it. POST only;
    # nginx's body limit is the API's own 64 KiB (the API counts the bytes itself as well). An
    # allow-list of the hub's address (`allow <hub>; deny all;`) follows once the hub's
    # $remote_addr has been seen in this server's log on the VM (plan, D-3).
    # tests/test_nginx_routes.py pins this block; proxy_pass stays above the nested blocks.
    location = /infinity-shadow/readings {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        default_type application/json;
        if ($scheme != "https") { return 403 '{"detail":{"reason":"https_required"}}'; }
        limit_except POST { deny all; }
    }

    # Every API router's prefix. A prefix missing here is served index.html with a 200 — the API
    # client then fails on HTML, far from the cause. tests/test_nginx_routes.py pins this list.
    # `(/|$)` keeps an SPA path that merely starts with a prefix (e.g. /administrator-guide) out.
    # infinity-research too: the API holds the hub credential and calls the hub, never the browser.
    # infinity-shadow (Aşama A): the hub forwarder POSTs the monitor strip's values here with its
    # own token, and the board GETs them; the API decides both (the body limit is the API's, 64 KiB).
    # infinity-waves (Lane C, dalga): the live waveform panel's GET, behind the strip board's gates;
    # the one path the server's access log leaves out (`$homunculus_access_logged`, at the top).
    location ~ ^/(auth|admin|tenant|admissions|shift-schedule|handovers|alerts|break-glass|scope|clinical|scores|alarm-quality|infinity-research|infinity-shadow|infinity-waves|patients|ack|ingest|view|audit|health|tasks)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html is never cached: the browser must be able to pick up a new build without the
    # operator clearing site data. The hashed assets under /assets are safe to cache forever.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
