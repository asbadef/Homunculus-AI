<!doctype html>
<html lang="az" data-theme="gun">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nobet.js test</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ev sahibi (anasayfa/index.html) değişkenleri ve kapsayıcısı */
:root, [data-theme="gun"] {
  --page:#f5f8fb; --card:#ffffff; --card2:#f1f4f8; --ink:#152231; --mute:#5c6b7d; --line:#e1e6ee; --line2:#cbd3de;
  --pri:#0e7490; --onpri:#ffffff; --priSoft:#e0f2f7; --priInk:#0e7490;
  --crit:#dc2626; --critSoft:#fdecec; --mid:#ca8a04; --midSoft:#fdf6e3; --ok:#16a34a; --okSoft:#e7f6ec;
  --spo:#a16207; --hr:#15803d; --tile:#f6f8fb;
  --shadow:0 20px 50px rgba(20,30,50,.10); --shadowS:0 6px 18px rgba(20,30,50,.06);
  --hdr:rgba(245,248,251,.82);
}
[data-theme="gece"] {
  --page:#07101f; --card:#0f1b2e; --card2:#15243b; --ink:#e8eef7; --mute:#8fa1ba; --line:#1c2c45; --line2:#2a3f60;
  --pri:#22b8d6; --onpri:#03141c; --priSoft:rgba(34,184,214,.13); --priInk:#7dd3e6;
  --crit:#ef4444; --critSoft:rgba(239,68,68,.12); --mid:#eab308; --midSoft:rgba(234,179,8,.12); --ok:#22c55e; --okSoft:rgba(34,197,94,.12);
  --spo:#ffe14a; --hr:#22e05a; --tile:#07101f;
  --shadow:0 24px 60px rgba(0,0,0,.45); --shadowS:0 8px 22px rgba(0,0,0,.3);
  --hdr:rgba(7,16,31,.8);
}
* { box-sizing:border-box; }
html, body { margin:0; overflow-x:clip; }
body { background:var(--page); color:var(--ink); font:16px/1.55 Figtree, system-ui, sans-serif; }
.hdr { position:sticky; top:0; z-index:50; height:68px; background:var(--hdr); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 32px; font-weight:700; }
.wrap { width:100%; max-width:1680px; margin:0 auto; padding:0 clamp(16px, 3.2vw, 56px); }
section.s { padding:96px 0; }
.head { margin-bottom:44px; }
@media (max-width:760px) { .wrap { padding:0 16px; } section.s { padding:64px 0; } }
</style>
</head>
<body>
<header class="hdr">test header (68px)</header>
<div style="height:1200px" class="wrap">üst dolgu</div>
<section id="nobet" class="s"><div class="wrap"><div class="head"><h2>Yoğun bakımda 24 saat (test)</h2></div><div id="nobet-mount"></div></div></section>
<div style="height:1500px">alt dolgu</div>
<script>
  // ev sahibi gibi: parçayı yükle, ardından dil olayını yay
  var sc = document.createElement("script"); sc.src = "nobet.js?v=" + Date.now();
  sc.onload = function () { var l = "AZ"; try { l = localStorage.getItem("hmc.lang") || "AZ"; } catch (e) {} document.dispatchEvent(new CustomEvent("hmc:lang", { detail:l })); };
  document.body.appendChild(sc);
</script>
</body>
</html>
