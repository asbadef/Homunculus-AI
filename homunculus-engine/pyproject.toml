[project]
name = "homunculus-engine"
version = "0.1.0"
description = "Homunculus real-time clinical intelligence engine (adult sepsis vertical)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    # [asyncio] pulls greenlet, which sqlalchemy.ext.asyncio needs: SQLAlchemy 2.1 no longer
    # installs it by itself, and without it the API cannot start. Below 2.2: a new minor is a
    # decision, not something a rebuild picks up (the image pins exact versions, constraints.txt).
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "fastapi>=0.110",
    "python-jose[cryptography]>=3.3",   # JWT
    "bcrypt>=4.1",                      # Password hashing (passlib dropped: unmaintained, breaks on bcrypt>=4.1)
    "pyotp>=2.9",                       # TOTP/MFA
    "alembic>=1.13",                    # DB migrations
    "psycopg2-binary>=2.9",             # PostgreSQL driver (sync, for Alembic)
    "asyncpg>=0.29",                    # PostgreSQL driver (async, for SQLAlchemy)
    "cryptography>=42.0",               # Fernet (PHI encryption)
    "python-multipart>=0.0.9",          # Form data
    "email-validator>=2.1",             # Email validation
    "uvicorn[standard]>=0.30",          # ASGI server (production serving)
    "ldap3>=2.9",                       # Active Directory sign-in (pure Python; spec §7)
]

[project.optional-dependencies]
# pytest-asyncio is not optional despite the name: [tool.pytest.ini_options] below sets
# asyncio_mode = "auto", so without it conftest.py fails to import and the whole suite is
# unrunnable on a clean checkout.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
