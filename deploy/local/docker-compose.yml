# Homunculus, entirely on the hospital's own server.
#
#   cd /opt/homunculus/local
#   cp .env.example .env && chmod 600 .env && $EDITOR .env
#   docker compose up -d
#
# Only `web` and `bridge` publish ports. Postgres and the API are reachable only from inside the
# Docker network: the database holds patient data and has no reason to be addressable from the ward
# network.

services:
  postgres:
    image: postgres:16
    container_name: homunculus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: homunculus
      # Required, like the other secrets: compose refuses a missing or blank value. Blank, a fresh
      # volume would fail to initialise, and the API's DATABASE_URL below would carry no password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing in .env - generate one, see .env.example}
      POSTGRES_DB: homunculus
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this. Without it, `alembic upgrade head` races the database's first
      # start and the API dies on a connection error that looks like a configuration fault.
      test: ["CMD-SHELL", "pg_isready -U homunculus -d homunculus"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ../../homunculus-engine
      dockerfile: Dockerfile.api
    container_name: homunculus-api
    restart: unless-stopped
    environment:
      # DATABASE_SSL is deliberately UNSET: ssl_context() then returns None and the connection is
      # plain, which is correct for a database on the same host. Setting it would demand a
      # certificate chain that does not exist here.
      DATABASE_URL: postgresql://homunculus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing in .env - generate one, see .env.example}@postgres:5432/homunculus
      # Required, not defaulted: the token is the only authority for a clinician's permissions and
      # tenant. Compose refuses a missing key; the API refuses a default or short one at start.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing in .env - generate one, see .env.example}
      # Required, not defaulted: without it the engine would fall back to a key derived from
      # JWT_SECRET and silently encrypt real names with it. Compose refuses to start instead.
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:?PHI_ENCRYPTION_KEY is missing in .env - generate a Fernet key, see .env.example}
      # The engine's hospital key for this tenant IS the seeded tenant slug — TENANTS maps the
      # bridge's bearer token to that same slug, and SEED_TENANT_SLUG (below) is what seed_admin.py
      # actually creates. Both MUST read from TENANT_SLUG so they cannot drift: if they ever named
      # different slugs, the admin account would be seeded under a hospital key the bridge (and any
      # JWT issued for it) can never resolve to, and the board would stay empty with no obvious cause.
      # Required: without a device token the API refuses to start (the bridge could send nothing
      # and every board would freeze silently), so compose refuses first, with a clearer message.
      TENANTS: ${TENANT_TOKEN:?TENANT_TOKEN is missing in .env - generate one, see .env.example}:${TENANT_SLUG:-demo-hastanesi}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      SEED_TENANT_SLUG: ${TENANT_SLUG:-demo-hastanesi}
      TZ: ${TZ:-Europe/Istanbul}
      BED_MAPPING_PATH: /app/bed-mapping.json
      # Infinity research window (optional). All three must be set or the page reports
      # "not configured"; none defaults, so a half-filled .env cannot point the API at a hub
      # it will then trust. The viewer token is the HUB's viewer credential — not the
      # collector token, and never handed to the browser.
      INFINITY_HUB_URL: ${INFINITY_HUB_URL:-}
      INFINITY_VIEWER_TOKEN: ${INFINITY_VIEWER_TOKEN:-}
      INFINITY_HUB_CA_FILE: ${INFINITY_HUB_CA_FILE:-}
      # Aşama A — the unvalidated monitor strip (docs/superpowers/plans/2026-10-15-infinity-asama-a-golge.md).
      # Unset = off. The token is the hub forwarder's, NOT a TENANTS device token: it opens
      # POST /infinity-shadow/readings and nothing else.
      INFINITY_CLINICAL_STAGE: ${INFINITY_CLINICAL_STAGE:-}
      INFINITY_SHADOW_TOKEN: ${INFINITY_SHADOW_TOKEN:-}
      INFINITY_SHADOW_HOSPITAL: ${TENANT_SLUG:-demo-hastanesi}
      INFINITY_DEVICE_BEDS_PATH: /etc/homunculus/infinity-shadow/device-beds.json
      # Active Directory sign-in (optional; spec §7, docs/EDGE-BRIDGE-LOCAL.md). LDAP_URL unset =
      # off. A value the API cannot use is logged and leaves AD sign-in off; it never stops the
      # API. The service account's password stays in .env and never reaches a browser.
      LDAP_URL: ${LDAP_URL:-}
      LDAP_CA_CERT: ${LDAP_CA_CERT:-}
      LDAP_ALLOW_INSECURE: ${LDAP_ALLOW_INSECURE:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      LDAP_LOGIN_ATTRS: ${LDAP_LOGIN_ATTRS:-}
      LDAP_NESTED_GROUPS: ${LDAP_NESTED_GROUPS:-}
      LDAP_TIMEOUT_S: ${LDAP_TIMEOUT_S:-}
      # Minutes without input after which the dashboard locks its screen (1-60; unset = 10). The
      # dashboard reads it from /auth/me; a value the API cannot use is logged and 10 applies.
      SCREEN_LOCK_IDLE_MINUTES: ${SCREEN_LOCK_IDLE_MINUTES:-}
      # Hours a browser may stay locked before it signs itself out (1-72; unset = 12).
      SCREEN_LOCK_SIGNOUT_HOURS: ${SCREEN_LOCK_SIGNOUT_HOURS:-}
      # A user with no unit, bed or patient assignment sees nothing (1/true/yes; unset = off:
      # an unassigned user sees the whole hospital). Turn it on only once assignments exist —
      # on an empty assignment table it blacks out every clinical screen at once.
      SCOPE_ENFORCE_UNASSIGNED: ${SCOPE_ENFORCE_UNASSIGNED:-}
    volumes:
      # This site's HIS-location -> our-bed table. Copy bed-mapping.example.json to
      # bed-mapping.json before the first `up`: Docker leaves a DIRECTORY at a bind-mount target
      # whose source is missing. The API survives that (it treats a directory as "no table"), but
      # then no patient lands on a bed and every location shows up in the discovery report.
      - ./bed-mapping.json:/app/bed-mapping.json:ro
      # The research hub's PUBLIC CA certificate, one file, read-only. Only this file — the
      # hub's config directory also holds the collector token and the TLS private key, and
      # neither belongs in a container that faces the ward network.
      - ${INFINITY_HUB_CA_HOST_PATH:-./infinity-ca.pem}:/etc/homunculus/infinity-ca.pem:ro
      # The domain controller's CA certificate (public): deploy/local/ldap-ca/ca.pem, with
      # LDAP_CA_CERT=/etc/homunculus/ldap-ca/ca.pem. A directory, not a file: Docker creates a
      # missing source, and a missing directory is harmless where a missing file would become a
      # directory named like a certificate.
      - ./ldap-ca:/etc/homunculus/ldap-ca:ro
      # Aşama A's approved device->bed table: deploy/local/infinity-shadow/device-beds.json, a copy
      # of deploy/infinity/device-beds.icu2.json checked by its sha256. A directory, not a file, for
      # the ldap-ca reason above: a missing file source would become a directory named
      # device-beds.json (what happened to bed-mapping.json). A missing table places no monitor
      # on a bed; it never stops the API.
      - ./infinity-shadow:/etc/homunculus/infinity-shadow:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: deploy/local/web/Dockerfile
      args:
        # The commit shown in the dashboard's account menu. The image is built without .git, so
        # pass it in: BUILD_SHA=$(git rev-parse --short HEAD) docker compose build web. Unset, the
        # dashboard says "version unknown".
        BUILD_SHA: ${BUILD_SHA:-}
    container_name: homunculus-web
    restart: unless-stopped
    ports:
      # No default: an unset value must fail `up` loudly rather than quietly binding the dashboard
      # — real login, and the API proxied behind it — to every interface this server has. The
      # device port below has no fallback either; the more sensitive port should not be the more
      # forgiving one.
      - "${WEB_LISTEN_ADDR}:${WEB_PORT:-80}:80"
      # HTTPS: Chrome disables the Notification API on plain HTTP, so alarm notifications need
      # the https:// address. Self-signed cert, minted on first start, kept on web-certs so a
      # rebuild does not re-trigger the browser warning on every ward machine.
      - "${WEB_LISTEN_ADDR}:${WEB_TLS_PORT:-8443}:443"
    environment:
      WEB_TLS_IP: ${WEB_LISTEN_ADDR}
    volumes:
      - web-certs:/etc/nginx/certs
    depends_on:
      - api

  bridge:
    image: ghcr.io/asbadef/homunculus-bridge:latest
    container_name: homunculus-bridge
    restart: unless-stopped
    ports:
      # Bound to the device-facing interface, never 0.0.0.0: MLLP carries patient data in plain
      # text with no authentication.
      - "${LISTEN_ADDR}:2575:2575"
    volumes:
      # Store-and-forward buffer. MUST persist: it holds observations the API has not acknowledged
      # yet, and a restart would otherwise discard them. It holds patient data in transit.
      - bridge-data:/data
      - ./site-mapping.json:/app/site-mapping.json:ro
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      # The identity mirror encrypts names at rest with this. The bridge signs nothing, so it
      # gets no JWT_SECRET: this container listens on the device VLAN and holds only what it uses.
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:?PHI_ENCRYPTION_KEY is missing in .env - generate a Fernet key, see .env.example}
    command:
      - scripts/run_bridge.py
      - --db
      - /data/bridge.db
      - --mapping
      - /app/site-mapping.json
      - --cloud-url
      - http://api:8000
      - --token
      - ${TENANT_TOKEN}
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nce:
    image: ghcr.io/asbadef/homunculus-bridge:latest
    container_name: homunculus-nce
    restart: unless-stopped
    volumes:
      # The vendor's session files. READ-ONLY on both sides: :ro here, and `-o ro` on the host
      # mount. The NCE server is a live clinical system; nothing here may write to it.
      - ${NCE_SHARE_PATH}:/nce:ro
      # Buffer and processed-file ledger. MUST persist: the buffer holds observations the API has
      # not acknowledged, and the ledger is the ONLY record of which sessions were forwarded —
      # losing it re-sends whatever the --since window covers.
      - nce-data:/data
      - ./nce-mapping.json:/app/nce-mapping.json:ro
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    command:
      - scripts/run_nce_bridge.py
      - --dir
      - /nce
      - --db
      - /data/nce.db
      - --mapping
      - /app/nce-mapping.json
      - --cloud-url
      - http://api:8000
      - --token
      - ${TENANT_TOKEN}
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  bridge-data:
  nce-data:
  web-certs:
